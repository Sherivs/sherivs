name: Release

# V1 release pipeline (MISSION-V1-017 deployment work package).
# Build and publish on version tags; deploy is human-gated on the
# "production" environment (approval law, Part 15/28) and FAILS CLOSED
# until BLK-3 deployment credentials are configured.
#
# Deploy path: the deploy job stages the tagged commit's deploy substrate
# (infrastructure/deploy/deploy.sh + docker-compose.yml) onto the target VM
# and invokes deploy.sh over SSH — the SAME health-gated, auto-rolling-back
# path documented in architecture/campaigns/V1-PROGRAM/OPERATIONS.md and
# infrastructure/deploy/README.md. There is deliberately NO raw `docker run`
# bypass: every production container swap goes through the deploy.sh health
# gate (pull first, compose up with fail-closed env_file, poll /health.json,
# auto-rollback to the previous image on failure, §38).
#
# Supply-chain hygiene: all third-party actions pinned to commit SHAs.
#
# Secret handling: DOCKER_* / DEPLOY_* values are referenced by name only,
# passed through env blocks, and never echoed. No secret VALUES appear in
# this file.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE_NAME: coregrid-scholar

jobs:
  verify:
    name: Verify (typecheck, tests, registry, secrets, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

  build-and-push:
    name: Build and push Docker image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to container registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract tag from git ref
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.version }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to production (human-approved, health-gated)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Two health windows (deploy + possible auto-rollback) plus image pull
    # and substrate staging fit inside this budget.
    timeout-minutes: 15
    # Human approval gate — Part 15/28 approval law.
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Fail closed — deployment credentials not configured (BLK-3)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_HOST" ] || [ -z "$DEPLOY_SSH_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::deployment credentials not configured (BLK-3)"
            echo "Deploy is blocked until BLK-3 credentials are supplied via repository/environment secrets."
            echo "IaC apply remains FROZEN pending BLK-3 — see infrastructure/README.md."
            exit 1
          fi

      # Runs infrastructure/deploy/deploy.sh ON the VM (staged from this
      # tagged commit): pull before swap, compose up with fail-closed env
      # file, poll /health.json, auto-rollback to the previous image (§38).
      # sudo -n keeps the SSH session non-interactive: it fails loudly rather
      # than hanging the runner if the deploy identity lacks passwordless
      # sudo. The VM itself must be pre-authorized to pull the image
      # (registry login done out-of-band by the operator, per OPERATIONS.md).
      - name: Deploy via health-gated substrate (deploy.sh over SSH)
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_NAMESPACE: ${{ secrets.DOCKER_NAMESPACE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh_opts=(-i "$HOME/.ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          image="${DOCKER_REGISTRY}/${DOCKER_NAMESPACE}/coregrid-scholar:${IMAGE_TAG}"
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"

          # Stage the deploy substrate from the tagged commit onto the VM so
          # the health gate/rollback logic matches the code being released.
          ssh "${ssh_opts[@]}" "$remote" \
            'sudo -n mkdir -p /opt/coregrid/deploy && sudo -n chown "$(id -u):$(id -g)" /opt/coregrid/deploy'
          scp "${ssh_opts[@]}" infrastructure/deploy/deploy.sh \
              infrastructure/deploy/docker-compose.yml "$remote:/opt/coregrid/deploy/"

          # Health-gated deploy: poll /health.json, auto-rollback on failure.
          ssh "${ssh_opts[@]}" "$remote" \
            "sudo -n bash /opt/coregrid/deploy/deploy.sh '$image'"
          rm -f ~/.ssh/id_ed25519
