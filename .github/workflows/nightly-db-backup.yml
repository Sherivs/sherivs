# Nightly encrypted off-server backup of the production Supabase database.
#
# - READ-ONLY: Supabase's session pooler (Supavisor) does not forward startup
#   options, so PGOPTIONS=-c default_transaction_read_only=on is silently
#   dropped (the first run proved it: the session reported "off"). Instead:
#     * pg_dump runs with --serializable-deferrable, i.e. its whole dump is one
#       SERIALIZABLE, READ ONLY, DEFERRABLE transaction (pg_dump never issues
#       writes, and the server would reject any inside that transaction);
#     * a pre-flight psql session issues SET default_transaction_read_only=on
#       itself, confirms it took effect, and proves a write is refused.
# - Encrypted with gpg (AES256, symmetric) using BACKUP_PASSPHRASE before it
#   leaves the runner; only ciphertext is uploaded (artifact, 90-day retention).
# - Verified: the decrypted temp copy must be non-empty and pg_restore -l must
#   list its tables; the plaintext is deleted in every outcome.
#
# Secrets: PROD_DB_URL_BACKUP (use the Supabase SESSION POOLER URI,
# *.pooler.supabase.com:5432 — the direct db.<ref>.supabase.co host is IPv6
# only on the Free plan and GitHub runners have no IPv6), BACKUP_PASSPHRASE.
# Restore: gpg --decrypt file.dump.gpg > file.dump && pg_restore -l file.dump
name: Nightly encrypted DB backup

on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump (read-only) + gpg + artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets are configured
        env:
          DB_URL: ${{ secrets.PROD_DB_URL_BACKUP }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$DB_URL" ] || { echo "::error::PROD_DB_URL_BACKUP secret is not set"; exit 1; }
          [ -n "$PASSPHRASE" ] || { echo "::error::BACKUP_PASSPHRASE secret is not set"; exit 1; }

      - name: Install pg_dump 17 (PGDG)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 gnupg
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump (read-only session), encrypt, verify
        env:
          DB_URL: ${{ secrets.PROD_DB_URL_BACKUP }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGCONNECT_TIMEOUT: "20"
        run: |
          set -euo pipefail
          umask 077
          BIN=/usr/lib/postgresql/17/bin
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          WORK="$(mktemp -d)"
          OUT="$GITHUB_WORKSPACE/backup-out"
          mkdir -p "$OUT"
          cleanup() { rm -rf "$WORK"; }
          trap cleanup EXIT

          # Pre-flight: in-session read-only must take effect through the pooler
          # and a write must be refused.
          ro="$("$BIN/psql" "$DB_URL" -X -At -v ON_ERROR_STOP=1 \
            -c "SET default_transaction_read_only = on" -c "SHOW default_transaction_read_only" | tail -n 1)"
          [ "$ro" = "on" ] || { echo "::error::could not make the session read-only ($ro)"; exit 1; }
          if "$BIN/psql" "$DB_URL" -X -At -v ON_ERROR_STOP=1 \
              -c "SET default_transaction_read_only = on" \
              -c "CREATE TEMP TABLE backup_ro_probe (i int)" >/dev/null 2>"$WORK/probe.err"; then
            echo "::error::write was NOT refused in a read-only session"; exit 1
          fi
          grep -q "read-only transaction" "$WORK/probe.err" || { echo "::error::unexpected probe error"; cat "$WORK/probe.err"; exit 1; }

          # The dump itself: one SERIALIZABLE, READ ONLY, DEFERRABLE transaction.
          "$BIN/pg_dump" "$DB_URL" --serializable-deferrable --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file "$WORK/db.dump"

          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 --compress-algo none \
            --output "$OUT/sherivs-prod-$STAMP.dump.gpg" "$WORK/db.dump" 3<<<"$BACKUP_PASSPHRASE"
          rm -f "$WORK/db.dump"

          # Verify the ciphertext round-trips: decrypt to a temp copy, list it.
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "$WORK/verify.dump" "$OUT/sherivs-prod-$STAMP.dump.gpg" 3<<<"$BACKUP_PASSPHRASE"
          size="$(stat -c %s "$WORK/verify.dump")"
          [ "$size" -gt 0 ] || { echo "::error::decrypted dump is empty"; exit 1; }
          "$BIN/pg_restore" -l "$WORK/verify.dump" > "$WORK/toc.txt"
          # TOC lines: "<id>; <oid> <oid> TABLE <schema> <name> ..." vs "... TABLE DATA ...".
          tables="$(awk '$4 == "TABLE" && $5 != "DATA"' "$WORK/toc.txt" | wc -l)"
          data="$(awk '$4 == "TABLE" && $5 == "DATA"' "$WORK/toc.txt" | wc -l)"
          rm -f "$WORK/verify.dump"
          [ "$tables" -gt 0 ] || { echo "::error::no tables in dump"; exit 1; }
          enc_size="$(stat -c %s "$OUT/sherivs-prod-$STAMP.dump.gpg")"
          {
            echo "### Nightly DB backup $STAMP"
            echo "- dump size (plaintext, deleted): $size bytes"
            echo "- encrypted artifact: $enc_size bytes"
            echo "- tables: $tables (with data entries: $data)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload encrypted backup (90 days)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sherivs-prod-db-${{ env.STAMP }}
          path: backup-out/*.dump.gpg
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
