name: Verify
# Track E: one fast PR/master pipeline. Jobs run in parallel and cancel superseded runs.
# Note: GitHub Actions billing is currently failing for this account, so runs are queued/blocked until billing is fixed;
# nothing here needs changing when it is. Preview deploys only run when the VERCEL_TOKEN secret exists.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --include=dev --ignore-scripts --no-audit --fund=false
      - run: npx tsc --noEmit

  lint:
    # master carries ~8k pre-existing (mostly Prettier) findings, so lint gates only the files a PR changes.
    name: Lint (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - name: ESLint on changed TS/JS files
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx' '*.js' '*.mjs' | grep -v '^mobile/' || true)
          if [ -z "$files" ]; then echo "no lintable changes"; exit 0; fi
          echo "$files" | xargs npx eslint --no-warn-ignored

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --include=dev --no-audit --fund=false
      - run: npm run test:unit

  role-management-screenshots:
    name: Role management UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://synthetic.supabase.test
      VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-role-management-test-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --include=dev --no-audit --fund=false
      - run: npx playwright install --with-deps chromium
      - name: Capture desktop and mobile role-management screens
        run: npx playwright test tests/e2e/role-management-screenshots.spec.ts --project=desktop-chromium --project=mobile-chromium
      # Screenshot-evidence job: keep the PNGs (success and failure). 3-day retention.
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: test-results/**/role-management-*.png
          if-no-files-found: warn
          retention-days: 3

  repo-guards:
    name: Registry, drift, neutrality, secrets guards + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --fund=false
      # npm audit --omit=dev at high/critical; dated, approved exceptions live in config/npm-audit-exceptions.json
      - run: node scripts/verify-npm-audit.mjs
      - run: npm run verify:registry && npm run verify:drift && npm run verify:neutrality && npm run verify:secrets
      - run: npm run verify:home-bundle:build

  workspace-e2e:
    name: Workspace shell E2E + screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: local-workspace-e2e-public-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci --no-audit --fund=false
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/workspace-shell.spec.ts --project=mobile-chromium
      # Playwright traces are large. Upload only when this E2E job fails.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: test-results/
          if-no-files-found: warn
          retention-days: 3

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: gitleaks (commits new to this PR / push; history audit is in docs/security/track-e-findings.md)
        run: |
          set -euo pipefail
          version=8.21.2
          archive="gitleaks_${version}_linux_x64.tar.gz"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL "$base/$archive" -o "$work/$archive"
          curl -sSfL "$base/gitleaks_${version}_checksums.txt" -o "$work/checksums.txt"
          grep -E "^[[:xdigit:]]{64}[[:space:]]+${archive}$" "$work/checksums.txt" > "$work/expected.sha256"
          test "$(wc -l < "$work/expected.sha256")" -eq 1
          (cd "$work" && sha256sum --check expected.sha256)
          if [ "${{ github.event_name }}" = "pull_request" ]; then range="origin/${{ github.base_ref }}..HEAD"; else range="${{ github.event.before }}..HEAD"; fi
          case "$range" in 0000000*) range="HEAD~1..HEAD";; ..HEAD) range="HEAD~1..HEAD";; esac
          tar -xzf "$work/$archive" -C "$work" gitleaks
          "$work/gitleaks" git --redact --no-banner -c .gitleaks.toml ${range:+--log-opts="$range"} .

  migrations-sim:
    # Migration dry-run: every migration applied in order to a throwaway local Postgres 17 + Supabase bootstrap,
    # then the sim scenarios, the Track E RLS leak check and a ~30 s k6 smoke through PostgREST. Never touches prod.
    name: Migration dry-run + sim smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: npm ci --no-audit --fund=false
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: tools/sim-lab/bin
          key: sim-lab-bin-pg17.2-pgrst12.2.3-k6v0.54.0
      - name: Apply all migrations (fresh DB)
        run: bash tools/sim-lab/up.sh
      - name: WhatsApp n8n RPC ambiguity fix (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/whatsapp-n8n-ambiguity-fix.local.sql 2>&1 | tee /tmp/wafix.out
          test "$(grep -c 'WA-FIX PASS' /tmp/wafix.out)" -ge 10
      - name: M12 retention tombstones (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/m12-retention-tombstones.local.sql 2>&1 | tee /tmp/m12-retention.out
          grep -q 'M12 ALL PASS' /tmp/m12-retention.out
      - name: M11 data-subject requests (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/m11-data-subject-requests.local.sql 2>&1 | tee /tmp/m11-dsr.out
          grep -q 'M11 ALL PASS' /tmp/m11-dsr.out
      - name: SV1-TWIN-01 provisioning and isolation (real Postgres, rolled back)
        run: |
          set -euo pipefail
          PGOPTIONS="-c coregrid.test_disposable_database=on" \
            psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
              -f tests/integration/sv1-twin-personal.local.sql 2>&1 | tee /tmp/sv1-twin.out
          ! grep -Fq 'SV1-TWIN-01 FAIL' /tmp/sv1-twin.out
          grep -Fq 'SV1-TWIN-01 provisioning and isolation checks: ALL PASS' /tmp/sv1-twin.out
      - name: ENGINE-01 person twin, role packs and isolation (real Postgres, rolled back)
        run: |
          set -euo pipefail
          PGOPTIONS="-c coregrid.test_disposable_database=on" \
            psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
              -f tests/integration/engine01-person-twin.local.sql 2>&1 | tee /tmp/engine01.out
          ! grep -Fq 'ENGINE-01 FAIL' /tmp/engine01.out
          grep -Fq 'ENGINE-01 HARNESS PASSED' /tmp/engine01.out
      - name: ENGINE-02 conductor compatibility view posture (real Postgres, rolled back)
        run: |
          set -euo pipefail
          PGOPTIONS="-c coregrid.test_disposable_database=on" \
            psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
              -f tests/integration/engine02-conductor-compat.local.sql 2>&1 | tee /tmp/engine02.out
          ! grep -Fq 'ENGINE-02 FAIL' /tmp/engine02.out
          grep -Fq 'ENGINE-02 HARNESS PASSED' /tmp/engine02.out
      - name: ENGINE-03 tool broker registry, vault references and append-only ledger (real Postgres, rolled back)
        run: |
          set -euo pipefail
          PGOPTIONS="-c coregrid.test_disposable_database=on" \
            psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
              -f tests/integration/engine03-tool-broker.local.sql 2>&1 | tee /tmp/engine03.out
          ! grep -Fq 'ENGINE-03 FAIL' /tmp/engine03.out
          grep -Fq 'ENGINE-03 HARNESS PASSED' /tmp/engine03.out
      - name: FIN-01 wallet authorization, overdraft and atomicity (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/fin-01-wallet-authorization.local.sql 2>&1 | tee /tmp/fin01.out
          grep -q 'FIN-01 RESULT: pass=37 fail=0' /tmp/fin01.out
          test "$(grep -c 'FIN-01 PASS' /tmp/fin01.out)" -ge 37
          ! grep -q 'FIN-01 FAIL' /tmp/fin01.out
      - name: FIN-01 concurrent metering (real Postgres, many connections)
        working-directory: tools/sim-lab
        run: |
          node ../../tests/integration/fin-01-wallet-concurrency.local.mjs 2>&1 | tee /tmp/fin01-conc.out
          grep -q 'FIN-01-CONC RESULT: pass=7 fail=0' /tmp/fin01-conc.out
      - name: ENT-01 subscription authorization and entitlement catalog (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/ent-01-subscription-authorization.local.sql 2>&1 | tee /tmp/ent01.out
          grep -q 'ENT-01 RESULT: pass=64 fail=0' /tmp/ent01.out
          test "$(grep -c 'ENT-01 PASS' /tmp/ent01.out)" -ge 64
          ! grep -q 'ENT-01 FAIL' /tmp/ent01.out
      - name: ENT-01 concurrent elevation attempts and rollback (real Postgres, many connections)
        working-directory: tools/sim-lab
        run: |
          node ../../tests/integration/ent-01-subscription-concurrency.local.mjs 2>&1 | tee /tmp/ent01-conc.out
          grep -q 'ENT-01-CONC RESULT: pass=8 fail=0' /tmp/ent01-conc.out
      - name: SEC-02 privilege hardening (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/sec02-privilege-hardening.local.sql 2>&1 | tee /tmp/sec02.out
          grep -q 'SEC02 ALL PASS' /tmp/sec02.out
      - name: WF-01 workflow schema isolation, immutability, limits and audit (real Postgres, rolled back)
        run: |
          set -euo pipefail
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/wf01-workflow-schema.local.sql 2>&1 | tee /tmp/wf01.out
          ! grep -Fq 'WF01 FAIL' /tmp/wf01.out
          grep -Fq 'WF01 ALL PASS' /tmp/wf01.out
      - name: WF-02 workflow permissions, templates and separation of duties (local Postgres, rolled back)
        run: |
          set -euo pipefail
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/wf02-workflow-permissions.local.sql 2>&1 | tee /tmp/wf02.out
          ! grep -Fq 'WF02 FAIL' /tmp/wf02.out
          grep -Fq 'WF02 ALL PASS' /tmp/wf02.out
      - name: WF-03 workflow runtime core and autonomy boundaries (local Postgres, rolled back)
        run: |
          set -euo pipefail
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/wf03-workflow-runtime.local.sql 2>&1 | tee /tmp/wf03.out
          ! grep -Fq 'WF03 FAIL' /tmp/wf03.out
          grep -Fq 'WF03 ALL PASS' /tmp/wf03.out
      - name: WF-05 event sources (local Postgres, rolled back)
        run: |
          set -euo pipefail
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/wf05-event-sources.local.sql 2>&1 | tee /tmp/wf05-sources.out
          ! grep -Fq 'WF05 FAIL' /tmp/wf05-sources.out
          grep -Eq 'WF05 ALL PASS: [0-9]+ checks' /tmp/wf05-sources.out
      - name: WF-01 SKIP LOCKED claim under concurrency (real Postgres, many connections)
        working-directory: tools/sim-lab
        run: |
          node ../../tests/integration/wf01-claim-concurrency.local.mjs 2>&1 | tee /tmp/wf01-conc.out
          grep -q 'WF01-CONC RESULT: pass=4 fail=0' /tmp/wf01-conc.out
      - name: M10 ROPA/DPIA tenant isolation (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/m10-ropa-dpia-register.local.sql 2>&1 | tee /tmp/m10-ropa-dpia.out
          grep -q 'M10 ALL PASS' /tmp/m10-ropa-dpia.out
      - name: Seed synthetic schools (10% scale)
        working-directory: tools/sim-lab
        run: SIM_SCALE=0.1 node sim/gen.mjs && node sim/seed-flows.mjs
      - name: Scenarios
        working-directory: tools/sim-lab
        run: node sim/scenarios.mjs
      - name: Database security audit + RLS leak regression
        working-directory: tools/sim-lab
        run: |
          node sim/security-audit.mjs > security-audit.json
          node -e "const a=require('./security-audit.json'); const bad=a.rls_disabled.length+a.rls_not_forced.length+a.secdef_no_search_path.length; if(bad){console.error(a);process.exit(1)}"
          node sim/rls-e-check.mjs
      - name: DB-12 feature_flags primary key and duplicate index (real Postgres, rolled back)
        run: |
          psql "postgresql://postgres@127.0.0.1:${SIM_PG_PORT:-54329}/postgres" -v ON_ERROR_STOP=1 \
            -f tests/integration/db12-flags-pk-and-index.local.sql 2>&1 | tee /tmp/db12.out
          grep -q 'DB12 ALL PASS' /tmp/db12.out
      - name: WF-04 workflow load and k6 smoke
        working-directory: tools/sim-lab
        run: |
          set -euo pipefail
          node load/tokens.mjs
          (bin/postgrest load/postgrest.conf > postgrest.log 2>&1 &) ; sleep 3
          WF04_N=8 WF04_WORKERS=2 node load/workflow-tick-load.mjs 2>&1 | tee /tmp/wf04-load.out
          grep -Eq 'WF04-LOAD RESULT: .* dup=0$' /tmp/wf04-load.out
          grep -Eq 'steps_per_minute=[1-9][0-9]*' /tmp/wf04-load.out
          node load/wf05-event-e2e.mjs 2>&1 | tee /tmp/wf05-e2e.out
          grep -Eq 'WF05-E2E RESULT: .* dup=0$' /tmp/wf05-e2e.out
          cd load && SMOKE=1 PEAK=50 ../bin/k6 run --quiet flows.js
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sim-lab-results
          path: |
            tools/sim-lab/sim/scenario-results.json
            tools/sim-lab/security-audit.json
            tools/sim-lab/results/wf04-workflow-tick-*.json
          if-no-files-found: ignore
          retention-days: 7

  mobile:
    name: Mobile typecheck (Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci --no-audit --fund=false
      - run: npm run typecheck

  preview:
    name: Vercel preview deploy
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [typecheck, unit]
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, pull-requests: write }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Skip when Vercel secrets are not configured
        id: gate
        run: '[ -n "$VERCEL_TOKEN" ] && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "::notice::VERCEL_TOKEN not set; skipping preview"'
      - if: steps.gate.outputs.ok == '1'
        name: Build + deploy preview (never --prod)
        run: |
          npm i -g vercel@65.10.0
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          # TanStack Start + Nitro emit Build Output API (.vercel/output), not a
          # static "dist" folder. Clear any leftover Output Directory override
          # from pulled project settings so vercel build does not look for dist.
          node -e 'const fs=require("fs");const p=".vercel/project.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));if(j.projectSettings){j.projectSettings.outputDirectory=null;}fs.writeFileSync(p,JSON.stringify(j,null,2));'
          # Offline vercel build may not set VERCEL=1; force Nitro vercel preset.
          export NITRO_PRESET=vercel
          # Preview is not production. Keep Sentry/PostHog keys only when the
          # pulled env file itself says APP_ENV=staging (names only; no values echoed).
          node scripts/strip-vendor-telemetry-env.mjs .vercel/.env.preview.local
          vercel build --token="$VERCEL_TOKEN"
          # Hobby teams BLOCK CLI deploys attributed to a non-owner git commit
          # (PR merge commits / CI authors). Prebuilt output does not need .git;
          # hide it so Vercel skips the collaboration author check.
          mv .git .git.bak
          set +e
          out=$(timeout 180 vercel deploy --prebuilt --token="$VERCEL_TOKEN" 2>&1)
          code=$?
          set -e
          mv .git.bak .git
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -1 || true)
          if [ "$code" -eq 124 ]; then
            echo "::error::vercel deploy timed out after 180s (often Hobby BLOCKED on commit author). Preview URL if any: ${url:-none}"
            exit 1
          fi
          if [ "$code" -ne 0 ] || [ -z "$url" ]; then
            echo "::error::vercel deploy failed (exit $code). Hobby BLOCKED means commit author is not the team owner; .git is hidden for prebuilt deploys to avoid that."
            exit 1
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $url"

  vercel-prod:
    name: Vercel production deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [typecheck, unit]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - name: Skip when Vercel secrets are not configured
        id: gate
        run: '[ -n "$VERCEL_TOKEN" ] && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "::notice::VERCEL_TOKEN not set; skipping production deploy"'
      - if: steps.gate.outputs.ok == '1'
        name: Build + deploy production
        run: |
          npm i -g vercel@65.10.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          node -e 'const fs=require("fs");const p=".vercel/project.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));if(j.projectSettings){j.projectSettings.outputDirectory=null;}fs.writeFileSync(p,JSON.stringify(j,null,2));'
          export NITRO_PRESET=vercel
          export VERCEL_GIT_COMMIT_SHA=$GITHUB_SHA
          # Production builds must not receive Sentry or PostHog credentials.
          # Force the explicit app env and drop those names from the pulled file
          # before vite inlines client env. Values are never printed.
          export APP_ENV=production
          export VITE_APP_ENV=production
          unset SENTRY_DSN SENTRY_AUTH_TOKEN VITE_SENTRY_DSN VITE_POSTHOG_KEY VITE_POSTHOG_HOST VITE_SENTRY_RELEASE VITE_SENTRY_ENVIRONMENT || true
          node scripts/strip-vendor-telemetry-env.mjs --force-app-env=production .vercel/.env.production.local
          vercel build --prod --token="$VERCEL_TOKEN"
          mv .git .git.bak
          set +e
          out=$(timeout 180 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>&1)
          code=$?
          set -e
          mv .git.bak .git
          printf '%s\n' "$out"
          url=$(printf '%s\n' "$out" | grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' | tail -1 || true)
          if [ "$code" -eq 124 ]; then
            echo "::error::vercel production deploy timed out after 180s. URL if any: ${url:-none}"
            exit 1
          fi
          if [ "$code" -ne 0 ] || [ -z "$url" ]; then
            echo "::error::vercel production deploy failed (exit $code)"
            exit 1
          fi
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Production: $url"
